<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bubu & Dudu Surprise 💌</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>


<div class="stars"></div>


<!-- PASSWORD SCREEN -->

<div class="screen active" id="passwordScreen">

    <div class="box">

        <div class="heart">❤️</div>

        <h1>Bubu & Dudu</h1>

        <p>
        A little birthday surprise is waiting for you...
        </p>

        <input 
        type="password" 
        id="password"
        placeholder="Enter the secret code">

        <button onclick="checkPassword()">
        Open 💌
        </button>

        <p id="error"></p>

    </div>

</div>



<!-- ENVELOPE SCREEN -->

<div class="screen" id="envelopeScreen">

    <div class="envelope" onclick="openLetter()">

        💌

    </div>

    <h2>
    Tap the envelope
    </h2>

</div>




<!-- LETTER SCREEN -->

<div class="screen" id="letterScreen">


<div class="letter">

<h1>
Happy Birthday 🎂
</h1>


<p id="text">

</p>


<button onclick="nextQuest()">
Continue ✨
</button>


</div>


</div>





<!-- QUEST SCREEN -->

<div class="screen" id="questScreen">


<div class="quest">


<h1>
A little quest ⭐
</h1>


<p>
Find the hidden stars to unlock the surprise!
</p>


<div class="game">

<span onclick="findStar(this)">⭐</span>
<span onclick="findStar(this)">⭐</span>
<span onclick="findStar(this)">⭐</span>

</div>


<p id="counter">
Stars found: 0/3
</p>


</div>


</div>






<!-- FINAL SCREEN -->

<div class="screen" id="finalScreen">


<div class="final">

<h1>
You did it! 🎁
</h1>


<p>
May your life be filled with happiness,
love and beautiful moments.
</p>


<h2>
With love ❤️
</h2>


</div>


</div>




<script src="script.js"></script>

</body>
</html>
