<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Birthday Surprise ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

</head>


<body>


<!-- HEART GAME -->

<section class="scene active" id="heartScene">

    <h1>Catch my heart ❤️</h1>

    <p>
    I have a little surprise for you...
    </p>

    <div id="heart">
        ❤️
    </div>

    <p id="heartText">
    Try to catch it!
    </p>

</section>





<!-- DATE CODE -->


<section class="scene" id="codeScene">


<div class="card">

<h1>
A secret code 🔐
</h1>


<p>
You caught my heart!
<br>
Now unlock the next surprise.
</p>


<input 
id="dateInput"
placeholder="DD.MM">


<button onclick="checkDate()">
Unlock ✨
</button>


<p id="codeError"></p>


</div>


</section>







<!-- STORY -->


<section class="scene" id="storyScene">


<div class="card">

<img src="images/bubu-dudu.png" class="picture">


<h1>
A little journey begins 🌙
</h1>


<p>
A special surprise is waiting for you...
</p>


<button onclick="nextScene('cakeScene')">
Continue 🎁
</button>


</div>


</section>







<!-- CAKE -->


<section class="scene" id="cakeScene">


<div class="card">


<h1>
Make a wish ✨
</h1>


<img src="images/cake.gif" class="cake">


<p>
Blow the candles 🕯
</p>


<button onclick="blowCandles()">
Blow 💨
</button>


</div>


</section>








<!-- LETTER -->


<section class="scene" id="letterScene">


<div class="letter">


<h1>
For you ❤️
</h1>


<p id="letterText">

</p>


</div>


</section>






<script src="script.js"></script>


</body>

</html>
